[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ctb"
version = "0.1.0"
description = "PATCH contextualized machine learning for heterogeneous TB treatment response"
authors = [{ name = "Ethan Wu" }]
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10,<3.13"

dependencies = [
  "numpy==1.26.4",
  "pandas==2.2.2",
  "pyarrow==16.1.0",
  "scikit-learn==1.5.1",
  "lightgbm==4.5.0",
  "shap==0.46.0",
  "matplotlib==3.9.1",
  "seaborn==0.13.2",
  "tableone==0.8.0",
  "upsetplot==0.9.0",
  "umap-learn==0.5.6",
  "python-dateutil==2.9.0.post0",
  "torch==2.7.1",
  "pytorch-lightning==2.6.5",
  "contextualized-ml==0.2.9",
]

[project.optional-dependencies]
# On-screen / interactive figure set (figures/*_plotly.py). Non-submission; the matplotlib set
# remains the Nature-Comms print figures. kaleido is for static PNG/SVG export.
viz-plotly = [
  "plotly==6.8.0",
  "kaleido==1.3.0",
]
dev = [
  "pytest==8.3.2",
  "pytest-cov==5.0.0",
  "mypy==1.11.1",
  "ruff==0.6.1",
  "pre-commit==3.8.0",
  "pandas-stubs==2.2.2.240807",
  "types-python-dateutil==2.9.0.20240821",
  "jupyter==1.0.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/ctb"]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "D", "UP", "B", "SIM", "ARG"]
ignore = ["D203", "D213"]

[tool.ruff.lint.per-file-ignores]
# N803/N806: uppercase X, C are standard ML matrix names (treatments, context).
"tests/*" = ["D", "ARG", "N806", "N803"]
"scripts/*" = ["D", "N806", "N803"]
"src/ctb/models/*" = ["N803", "N806"]
"src/ctb/data/treatments.py" = ["N803", "N806"]
"src/ctb/data/context.py" = ["N803", "N806"]

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.mypy]
python_version = "3.10"
strict = true
files = ["src/ctb"]
warn_unused_configs = true
disallow_untyped_defs = true
no_implicit_optional = true

[[tool.mypy.overrides]]
module = [
    "lightgbm.*",
    "shap.*",
    "tableone.*",
    "upsetplot.*",
    "seaborn.*",
    "sklearn.*",
    "matplotlib.*",
    "contextualized.*",
    "pytorch_lightning.*",
    "scipy.*",
    "torch.*",
    "umap.*",
    "lifelines.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"

[tool.coverage.run]
source = ["src/ctb"]
branch = true
