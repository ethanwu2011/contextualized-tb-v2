[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ctb"
version = "0.2.0"
description = "Endpoint-guarded contextualized modelling scaffolds for the PATCH tuberculosis audit"
authors = [{ name = "Ethan Wu" }]
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10,<3.13"

dependencies = [
  "numpy==1.26.4",
  "pandas==2.2.2",
  "pyarrow==16.1.0",
  "scikit-learn==1.5.1",
  "lightgbm==4.5.0",
  "shap==0.46.0",
  "matplotlib==3.9.1",
  "seaborn==0.13.2",
  "scipy==1.15.3",
  "statsmodels==0.14.6",
  "torch==2.4.0",
  "tableone==0.8.0",
  "upsetplot==0.9.0",
  "umap-learn==0.5.6",
  "python-dateutil==2.9.0.post0",
]

[project.optional-dependencies]
# On-screen / interactive figure set (figures/*_plotly.py). Non-submission; the matplotlib set
# remains the Nature-Comms print figures. kaleido is for static PNG/SVG export.
viz-plotly = [
  "plotly==6.8.0",
  "kaleido==1.3.0",
]
# Optional submission-asset and secondary survival-analysis tooling. The core PATCH estimator and
# synthetic provenance smoke test do not import these packages.
release-assets = [
  "lifelines==0.30.0",
  "pillow==12.2.0",
  "python-pptx==1.0.2",
]
# Public SINAN source reconstruction. This extra is not required for the TB Portals analysis.
brazil = [
  "datasus-dbc==0.1.3",
  "dbfread==2.0.7",
]
dev = [
  "pytest==8.3.2",
  "pytest-cov==5.0.0",
  "mypy==1.11.1",
  "ruff==0.6.1",
  "pre-commit==3.8.0",
  "pandas-stubs==2.2.2.240807",
  "types-python-dateutil==2.9.0.20240821",
  "jupyter==1.0.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/ctb"]

# Linux CI/reviewer environments use PyTorch's CPU wheel index; macOS arm64 uses the ordinary
# PyPI wheel. This avoids silently pulling a CUDA runtime into the supported CPU-only release path.
[tool.uv.sources]
torch = [
  { index = "pytorch-cpu", marker = "sys_platform == 'linux'" },
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "D", "UP", "B", "SIM", "ARG"]
ignore = ["D203", "D213"]

[tool.ruff.lint.per-file-ignores]
# N803/N806: uppercase X, C are standard ML matrix names (treatments, context).
"tests/*" = ["D", "ARG", "N806", "N803"]
# Long human-readable audit strings are intentionally kept intact in the command-line drivers.
"scripts/*" = ["D", "N806", "N803", "E501"]
"scripts/26_enrichment_permutation_null.py" = ["F841"]
"scripts/27_profile_stability_null.py" = ["E702"]
"scripts/28_effect_recovery_benchmark.py" = ["E702"]
"src/ctb/models/*" = ["N803", "N806"]
"src/ctb/data/treatments.py" = ["N803", "N806"]
"src/ctb/data/context.py" = ["N803", "N806"]
"src/ctb/data/model_matrices.py" = ["N803", "N806"]

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.mypy]
python_version = "3.10"
strict = true
files = ["src/ctb"]
warn_unused_configs = true
disallow_untyped_defs = true
no_implicit_optional = true

[[tool.mypy.overrides]]
module = [
    "lightgbm.*",
    "shap.*",
    "tableone.*",
    "upsetplot.*",
    "seaborn.*",
    "sklearn.*",
    "matplotlib.*",
    "contextualized.*",
    "pytorch_lightning.*",
    "scipy.*",
    "torch.*",
    "umap.*",
    "lifelines.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"

[tool.coverage.run]
source = ["src/ctb"]
branch = true
